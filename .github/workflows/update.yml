name: Refresh Preview Cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-verse-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Impact card
        uses: ./components/impact-card
        with:
          users: Morningstar202604
          output: components/impact-card/preview/impact-card.svg

      - name: Stats card
        uses: ./components/stats-card
        with:
          user: Morningstar202604
          output: components/stats-card/preview/stats-card.svg

      - name: Streak card
        uses: ./components/streak-card
        with:
          user: Morningstar202604
          output: components/streak-card/preview/streak-card.svg

      - name: Typing card
        uses: ./components/typing-card
        with:
          output: components/typing-card/preview/typing-card.svg

      - name: Contribution grid card (3D)
        uses: ./components/contrib-grid-card
        with:
          user: Morningstar202604
          output: components/contrib-grid-card/preview/contrib-grid-card.svg

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add components/*/preview/*.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh preview cards [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push || { git fetch origin && git rebase origin/main && git push; }
          fi
