name: Refresh Impact Card Preview

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: impact-card-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate impact card
        uses: ./components/impact-card
        with:
          users: Morningstar202604
          output: components/impact-card/preview/impact-card.svg

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add components/impact-card/preview/impact-card.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh impact card preview [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push || { git fetch origin && git rebase origin/main && git push; }
          fi
