name: "Streak Card"
description: >-
  [Profile Verse] A differentiated streak card: current streak as the star at
  the centre of a golden orbital ring, with longest streak and yearly total.
author: "Morningstar202604"
branding:
  icon: "star"
  color: "yellow"

inputs:
  user:
    description: "GitHub username"
    required: true
  output:
    description: "Output path for the generated SVG"
    required: false
    default: "streak-card.svg"
  token:
    description: "GitHub token (defaults to the workflow's github.token)"
    required: false
    default: "${{ github.token }}"
  theme:
    description: "Theme: dark (midnight) | light (ivory) | rose (rose gold) | ocean (deep sea)"
    required: false
    default: "dark"

runs:
  using: "composite"
  steps:
    - name: "Generate streak card"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        USER: ${{ inputs.user }}
        OUTPUT: ${{ inputs.output }}
        THEME: ${{ inputs.theme }}
      run: python3 "${{ github.action_path }}/generate_streak_card.py"
